name: Controlli del server

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
