name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  ambiente:
    runs-on: ubuntu-latest
    steps:
      - name: Versioni stabili delle librerie Android
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/activity/activity-compose \
                   androidx/work/work-runtime-ktx androidx/core/core-ktx androidx/documentfile/documentfile \
                   androidx/lifecycle/lifecycle-runtime-compose androidx/browser/browser; do
            v=$(curl -s "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" \
              | grep -oE "<version>[0-9.]+</version>" | sed -E 's#</?version>##g' | tail -3 | tr '\n' ' ')
            echo "$a: $v"
          done
